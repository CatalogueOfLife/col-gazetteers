name: Rebuild gazetteer data

# Weekly cron catches upstream data drift (VLIZ, Natural Earth, TDWG, RESOLVE
# can all update without telling us). Otherwise this is a manual action —
# trigger it from the Actions tab after touching anything under scripts/.
# mrgid takes hours and has its own workflow, build-mrgid.yml.
on:
  schedule:
    - cron: "0 5 * * 1"   # Mondays 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-gazetteers
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    # iso takes about 65 minutes, nearly all of it waiting for Overpass, and all
    # the others about 8 together.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          # Need write access to the working branch.
          token: ${{ secrets.GITHUB_TOKEN }}
          # Keep history; we commit on top of HEAD.
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install GDAL / ogr2ogr
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdal-bin
          ogr2ogr --version

      - name: Install Python deps
        run: pip install --quiet requests shapely osm2geojson

      - name: Rebuild, validate and commit what changed
        env:
          BUILD_LIMIT: 120m
        run: bash scripts/rebuild.sh fao iho tdwg iso longhurst costello realm teow wdpa gi
