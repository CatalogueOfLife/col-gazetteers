[project]
name = "col-gazetteers-build"
version = "0.1.0"
description = "Build scripts that turn upstream sources (VLIZ, FAO, TDWG, Natural Earth, WWF) into the on-disk gazetteer tree consumed by the ChecklistBank backend."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    # OSM augmentation: converts Overpass JSON responses into GeoJSON
    # (admin-boundary MultiPolygon assembly is non-trivial — let osm2geojson
    # handle the ring stitching). Pulls in shapely + numpy.
    "osm2geojson>=0.3",
    # 2.1 for the coverage checks the realm build relies on
    "shapely>=2.1",
    # build_maps.py: map.svg, map.png and map-thumb.png of each gazetteer
    "matplotlib>=3.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["common*", "continent*", "costello*", "fao*", "gi*", "iho*", "iso*", "longhurst*", "mrgid*", "realm*", "tdwg*", "teow*", "wdpa*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pyright]
include = ["common", "continent", "costello", "fao", "gi", "iho", "iso", "longhurst", "mrgid", "realm", "tdwg", "teow", "wdpa"]
extraPaths = ["."]
