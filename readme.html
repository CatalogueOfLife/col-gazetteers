<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CoL gazetteers — README</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --fg: #1a1a1a;
    --muted: #6b7280;
    --border: #d0d7de;
    --bg-soft: #f6f8fa;
    --accent: #2563eb;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
         color: var(--fg); background: white; }
  main { max-width: 980px; margin: 0 auto; padding: 1.5rem 2rem 4rem; }
  nav { max-width: 980px; margin: 0 auto; padding: .9rem 2rem; border-bottom: 1px solid var(--border);
        display: flex; gap: 1rem; align-items: baseline; }
  nav a { color: var(--accent); text-decoration: none; }
  nav a:hover { text-decoration: underline; }
  nav .spacer { flex: 1; }
  nav .src { color: var(--muted); font-size: 13px; }
  h1, h2, h3, h4 { margin-top: 1.6em; margin-bottom: .5em; line-height: 1.25; }
  h1 { font-size: 1.9em; border-bottom: 1px solid var(--border); padding-bottom: .3em; }
  h2 { font-size: 1.45em; border-bottom: 1px solid var(--border); padding-bottom: .3em; }
  h3 { font-size: 1.2em; }
  p, ul, ol, table, pre { margin: 0 0 1em; }
  a { color: var(--accent); }
  code { background: var(--bg-soft); padding: .15em .35em; border-radius: 3px; font-size: 90%;
         font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  pre { background: var(--bg-soft); padding: 1em; border-radius: 4px; overflow: auto; font-size: 90%; }
  pre code { background: transparent; padding: 0; }
  table { border-collapse: collapse; width: 100%; }
  table th, table td { border: 1px solid var(--border); padding: .5em .75em; vertical-align: top; }
  table th { background: var(--bg-soft); text-align: left; }
  blockquote { margin: 0 0 1em; padding-left: 1em; border-left: 4px solid var(--border); color: var(--muted); }
  ul, ol { padding-left: 1.5em; }
  hr { border: 0; border-top: 1px solid var(--border); margin: 2em 0; }
  .loading { color: var(--muted); font-style: italic; }
  .error { color: #b91c1c; background: #fef2f2; border: 1px solid #fecaca;
           padding: .8rem 1rem; border-radius: 4px; }
</style>
</head>
<body>
<nav>
  <a href="index.html">← Viewer (map)</a>
  <span class="spacer"></span>
  <span class="src">Source: <a href="README.md">README.md</a> · <a href="https://github.com/CatalogueOfLife/col-gazetteers#readme" rel="noopener">github.com</a></span>
</nav>
<main id="content"><p class="loading">Loading README…</p></main>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"
        integrity="sha384-NNQgBjjuhtXzPmmy4gurS5X7P4uTt1DThyevz4Ua0IVK5+kazYQI1W27JHjbbxQz" crossorigin="anonymous"></script>
<script>
"use strict";

// Render local relative links to .md as .html (so README's link to README itself
// or to nested docs stays inside the site), and leave everything else alone.
function rewriteMdLinks(html) {
  return html.replace(/href="([^"#?]+)\.md(#[^"]*)?"/g, (m, base, hash) => {
    if (/^[a-z][a-z0-9+.-]*:\/\//i.test(base)) return m;   // absolute URLs
    if (base === "README") return `href="readme.html${hash || ""}"`;
    return `href="${base}.html${hash || ""}"`;
  });
}

async function init() {
  const target = document.getElementById("content");
  try {
    const md = await fetch("README.md").then(r => {
      if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
      return r.text();
    });
    marked.setOptions({ gfm: true, breaks: false });
    const html = marked.parse(md);
    target.innerHTML = rewriteMdLinks(html);
    document.title = "CoL gazetteers — " +
      (target.querySelector("h1")?.textContent.trim() || "README");
  } catch (err) {
    const detail = location.protocol === "file:"
      ? "This page must be served via a local web server, not file://. " +
        "From the repo root: <code>python3 -m http.server 8765</code> and open http://localhost:8765/readme.html."
      : err.message;
    target.innerHTML = `<div class="error"><b>Failed to load README.md.</b><br>${detail}</div>`;
  }
}
init();
</script>
</body>
</html>
