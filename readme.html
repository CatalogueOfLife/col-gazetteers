<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CoL gazetteers — README</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --fg: #1a1a1a;
    --muted: #6b7280;
    --border: #d0d7de;
    --bg-soft: #f6f8fa;
    --accent: #2563eb;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
         color: var(--fg); background: white; }
  main { max-width: 980px; margin: 0 auto; padding: 1.5rem 2rem 4rem; }
  nav { max-width: 980px; margin: 0 auto; padding: .9rem 2rem; border-bottom: 1px solid var(--border);
        display: flex; gap: 1rem; align-items: baseline; }
  nav a { color: var(--accent); text-decoration: none; }
  nav a:hover { text-decoration: underline; }
  nav .spacer { flex: 1; }
  nav .src { color: var(--muted); font-size: 13px; }
  h1, h2, h3, h4 { margin-top: 1.6em; margin-bottom: .5em; line-height: 1.25; }
  h1 { font-size: 1.9em; border-bottom: 1px solid var(--border); padding-bottom: .3em; }
  h2 { font-size: 1.45em; border-bottom: 1px solid var(--border); padding-bottom: .3em; }
  h3 { font-size: 1.2em; }
  p, ul, ol, table, pre { margin: 0 0 1em; }
  a { color: var(--accent); }
  code { background: var(--bg-soft); padding: .15em .35em; border-radius: 3px; font-size: 90%;
         font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  pre { background: var(--bg-soft); padding: 1em; border-radius: 4px; overflow: auto; font-size: 90%; }
  pre code { background: transparent; padding: 0; }
  table { border-collapse: collapse; width: 100%; }
  table th, table td { border: 1px solid var(--border); padding: .5em .75em; vertical-align: top; }
  table th { background: var(--bg-soft); text-align: left; }
  blockquote { margin: 0 0 1em; padding-left: 1em; border-left: 4px solid var(--border); color: var(--muted); }
  ul, ol { padding-left: 1.5em; }
  hr { border: 0; border-top: 1px solid var(--border); margin: 2em 0; }
  .loading { color: var(--muted); font-style: italic; }
  .error { color: #b91c1c; background: #fef2f2; border: 1px solid #fecaca;
           padding: .8rem 1rem; border-radius: 4px; }
</style>
</head>
<body>
<nav>
  <a href="index.html">← Viewer (map)</a>
  <a id="home" href="readme.html" hidden>README</a>
  <span class="spacer"></span>
  <span class="src">Source: <a id="src-md" href="README.md">README.md</a> · <a id="src-gh" href="https://github.com/CatalogueOfLife/col-gazetteers#readme" rel="noopener">github.com</a></span>
</nav>
<main id="content"><p class="loading">Loading README…</p></main>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"
        integrity="sha384-NNQgBjjuhtXzPmmy4gurS5X7P4uTt1DThyevz4Ua0IVK5+kazYQI1W27JHjbbxQz" crossorigin="anonymous"></script>
<script>
"use strict";

// Renders any Markdown file of the repo: readme.html shows README.md, and
// readme.html?file=continent/README.md shows that gazetteer's README.

const REPO = "https://github.com/CatalogueOfLife/col-gazetteers";
// readme.html sits at the repo root, so its directory is the root of the published tree.
const SITE_ROOT = new URL(".", location.href);

const escapeHtml = s => s.replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);

// Path of a site URL relative to the repo root, or null for URLs outside the site.
function repoPath(url) {
  if (url.origin !== SITE_ROOT.origin || !url.pathname.startsWith(SITE_ROOT.pathname)) return null;
  return decodeURIComponent(url.pathname.slice(SITE_ROOT.pathname.length));
}

// The rendered HTML goes into the page unsanitised, so only .md files of this site are accepted.
function sourceUrl() {
  const requested = new URLSearchParams(location.search).get("file") || "README.md";
  const url = new URL(requested, SITE_ROOT);
  if (!repoPath(url)?.endsWith(".md")) throw new Error(`Not a Markdown file of this site: ${requested}`);
  return url;
}

function pageHref(path, hash) {
  if (path === "README.md") return `readme.html${hash}`;
  return `readme.html?file=${encodeURIComponent(path).replace(/%2F/g, "/")}${hash}`;
}

const isRelative = ref => !!ref && !/^([a-z][a-z0-9+.-]*:|\/|#)/i.test(ref);

// Relative links and images are written relative to the .md file, not to readme.html.
// Links to other .md files open in this renderer; GitHub Pages does not serve
// dot-directories such as .github/, so those go to github.com instead.
function rewriteLinks(root, mdUrl) {
  for (const a of root.querySelectorAll("a[href]")) {
    const ref = a.getAttribute("href");
    if (!isRelative(ref)) continue;
    const url = new URL(ref, mdUrl);
    const path = repoPath(url);
    if (path?.endsWith(".md")) a.setAttribute("href", pageHref(path, url.hash));
    else if (path?.split("/").some(s => s.startsWith("."))) a.setAttribute("href", `${REPO}/blob/main/${path}${url.hash}`);
    else a.setAttribute("href", url.href);
  }
  for (const img of root.querySelectorAll("img[src]")) {
    const ref = img.getAttribute("src");
    if (isRelative(ref)) img.setAttribute("src", new URL(ref, mdUrl).href);
  }
}

// marked no longer emits heading ids; add GitHub-style slugs so #section links work.
function addHeadingIds(root) {
  const seen = new Map();
  for (const h of root.querySelectorAll("h1, h2, h3, h4, h5, h6")) {
    const slug = h.textContent.trim().toLowerCase()
      .replace(/[^\p{L}\p{N}\s_-]/gu, "").replace(/\s/g, "-");
    const n = seen.get(slug) || 0;
    seen.set(slug, n + 1);
    h.id = n ? `${slug}-${n}` : slug;
  }
}

async function init() {
  const target = document.getElementById("content");
  let name = "README.md";
  try {
    const mdUrl = sourceUrl();
    name = repoPath(mdUrl);
    document.getElementById("src-md").href = mdUrl.href;
    document.getElementById("src-md").textContent = name;
    document.getElementById("src-gh").href = name === "README.md" ? `${REPO}#readme` : `${REPO}/blob/main/${name}`;
    document.getElementById("home").hidden = name === "README.md";

    const md = await fetch(mdUrl).then(r => {
      if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
      return r.text();
    });
    marked.setOptions({ gfm: true, breaks: false });
    target.innerHTML = marked.parse(md);
    rewriteLinks(target, mdUrl);
    addHeadingIds(target);
    document.title = "CoL gazetteers — " +
      (target.querySelector("h1")?.textContent.trim() || name);
    // The content arrived after the browser looked for the #fragment.
    if (location.hash) document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView();
  } catch (err) {
    const detail = location.protocol === "file:"
      ? "This page must be served via a local web server, not file://. " +
        "From the repo root: <code>python3 -m http.server 8765</code> and open http://localhost:8765/readme.html."
      : escapeHtml(err.message);
    target.innerHTML = `<div class="error"><b>Failed to load ${escapeHtml(name)}.</b><br>${detail}</div>`;
  }
}
init();
</script>
</body>
</html>
